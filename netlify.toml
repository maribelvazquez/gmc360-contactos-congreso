[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/t/*"
  to = "/tarjeta.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/equipo.json"
  [headers.values]
    Cache-Control = "no-cache"
